[workspace]
resolver = "2"
members = [
    "crates/oxin-app",
]

[package]
name = "oxide"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui", "audio"] }
oxin-app = { path = "crates/oxin-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
audio = []

[profile.dev]
opt-level = 1
# Line tables keep panic backtraces readable while avoiding heavy full-DWARF RAM/link overhead.
debug = "line-tables-only"

[profile.dev.package."*"]
# Keep third-party crates optimized for smooth dev FPS without -O3 LLVM bloat or dep debuginfo.
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
