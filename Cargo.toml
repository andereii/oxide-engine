[workspace]
resolver = "2"
members = [
    "crates/oxin-app",
]

[package]
name = "oxide"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
bevy = "=0.20.1"
oxin-app = { path = "crates/oxin-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
audio = []

[profile.release]
opt-level = 3
lto = "thin"
