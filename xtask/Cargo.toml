[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oxide-audio = { path = "../crates/oxide-audio" }
oxide-atlas = { path = "../crates/oxide-atlas" }
oxide-data = { path = "../crates/oxide-data" }
oxide-game = { path = "../crates/oxide-game" }
oxide-input = { path = "../crates/oxide-input" }
oxide-media = { path = "../crates/oxide-media" }
serde = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
zip = { version = "8.2", default-features = false, features = ["deflate-flate2", "deflate-flate2-zlib-rs"] }
