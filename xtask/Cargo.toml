[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oxide-atlas = { path = "../crates/oxide-atlas" }
oxide-data = { path = "../crates/oxide-data" }
oxide-media = { path = "../crates/oxide-media" }
