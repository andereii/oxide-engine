name: Build Oxide Engine

on:
  push:
    branches: [main, raw, dev]
    paths-ignore:
      - "assets/**"
      - "bin/**"
      - "scripts/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo build profile"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: oxide-windows
          - platform: linux
            os: ubuntu-latest
            artifact: oxide-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            crates
            .github

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Build oxide (debug)
        if: ${{ inputs.profile != 'release' }}
        run: cargo build --features audio

      - name: Build oxide (release)
        if: ${{ inputs.profile == 'release' }}
        run: cargo build --release --features audio

      - name: Stage binary artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $profileDir = if ("${{ inputs.profile }}" -eq "release") { "release" } else { "debug" }
          Copy-Item "target/$profileDir/oxide.exe" "dist/oxide.exe"
          if (Test-Path "target/$profileDir/oxide.pdb") {
            Copy-Item "target/$profileDir/oxide.pdb" "dist/oxide.pdb"
          }

      - name: Stage binary artifact (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ inputs.profile }}" = "release" ]; then
            PROFILE_DIR="release"
          else
            PROFILE_DIR="debug"
          fi
          cp "target/$PROFILE_DIR/oxide" "dist/oxide"
          chmod +x "dist/oxide"

      - name: Upload ${{ matrix.artifact }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7
