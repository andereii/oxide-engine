name: Build Oxide Engine (Windows)

on:
  push:
    branches: [main, raw, dev]
    paths-ignore:
      - "assets/**"
      - "bin/**"
      - "scripts/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo build profile"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            crates
            .github

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Build oxide (debug)
        if: ${{ inputs.profile != 'release' }}
        run: cargo build --features audio

      - name: Build oxide (release)
        if: ${{ inputs.profile == 'release' }}
        run: cargo build --release --features audio

      - name: Stage binary artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $profileDir = if ("${{ inputs.profile }}" -eq "release") { "release" } else { "debug" }
          Copy-Item "target/$profileDir/oxide.exe" "dist/oxide.exe"
          if (Test-Path "target/$profileDir/oxide.pdb") {
            Copy-Item "target/$profileDir/oxide.pdb" "dist/oxide.pdb"
          }

      - name: Upload oxide-windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-windows
          path: dist/
          retention-days: 7

