name: Portable verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: quick-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "4"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static-lint dependency
        run: python -m pip install -r tools/requirements-workflow.txt
      - name: Lint active workflow
        run: python tools/workflow_lint.py
      - name: Test workflow controls
        run: python -B -m unittest discover -s tools -p test_workflow.py -v
      - name: Quick portable Rust verification (not milestone acceptance)
        run: python tools/workflow.py run --timeout 1800 -- cargo xtask verify --profile quick
      - name: Upload scoped evidence only (never original assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-${{ matrix.platform }}
          path: target/verify.json
          if-no-files-found: warn
